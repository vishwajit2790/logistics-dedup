spring.application.name=logistics-dedup
# 'local' = infra from docker compose on localhost. Override with SPRING_PROFILES_ACTIVE.
spring.profiles.default=local

spring.data.mongodb.auto-index-creation=true
spring.data.redis.timeout=200ms

app.cache.ttl=24h

# ---- Monitoring (Actuator + Micrometer + Prometheus) ----
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
# Redis is an optional cache (app fails open), so only MongoDB decides readiness.
management.endpoint.health.group.readiness.include=readinessState,mongo
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
